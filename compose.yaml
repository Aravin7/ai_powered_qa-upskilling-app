services:
  db:
    image: postgres:17.6
    environment:
      POSTGRES_USER: qa
      POSTGRES_PASSWORD: qa_local_only
      POSTGRES_DB: qa_pathway
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - qa_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qa -d qa_pathway"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  qa_data:
